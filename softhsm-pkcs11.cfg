# SunPKCS11 configuration for SoftHSM (used by HsmContext / PkiController).
# The JVM must run on the same OS as this native library — i.e. inside WSL,
# since SoftHSM is installed in Ubuntu/WSL here.
name = SoftHSM-RA
library = /usr/lib/softhsm/libsofthsm2.so
# First token with a token present (the initialized "ra-poc" token).
slotListIndex = 0
